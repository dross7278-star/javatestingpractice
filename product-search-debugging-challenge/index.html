<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Search</title>
  </head>
  <body>
    <header class="header">
      <h1>Product Search</h1>

      <button id="cart-button" type="button">
        Cart (<span id="cart-count">0</span>)
      </button>
    </header>

    <main>
      <section class="controls" aria-label="Product controls">
        <label>
          Search products
          <input
            id="search-input"
            type="search"
            placeholder="Try headphones, keyboard, lamp..."
          />
        </label>

        <label>
          Category
          <select id="category-filter">
            <option value="all">All categories</option>
            <option value="audio">Audio</option>
            <option value="office">Office</option>
            <option value="home">Home</option>
          </select>
        </label>

        <label>
          Sort by
          <select id="sort-select">
            <option value="name">Name</option>
            <option value="price-asc">Price: low to high</option>
            <option value="price-desc">Price: high to low</option>
            <option value="rating">Rating</option>
          </select>
        </label>
      </section>

      <p id="status" role="status"></p>

      <section
        id="product-list"
        class="product-list"
        aria-label="Product list"
      ></section>
    </main>

    <aside id="cart-panel" class="cart-panel" hidden>
      <div class="cart-header">
        <h2>Your cart</h2>
        <button id="close-cart-button" type="button">Close</button>
      </div>

      <ul id="cart-items"></ul>
    </aside>

    <div
      id="product-modal"
      class="modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modal-title"
      hidden
    >
      <div class="modal-content">
        <button id="close-modal-button" type="button" aria-label="Close modal">
          ×
        </button>

        <h2 id="modal-title">Product details</h2>
        <div id="modal-body"></div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
